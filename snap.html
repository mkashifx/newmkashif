<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snap Clone</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#FFD600;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:#000;
font-weight:bold;
}

header button{
padding:10px 15px;
border:none;
border-radius:20px;
cursor:pointer;
background:#000;
color:#fff;
}

.story-bar{
display:flex;
overflow-x:auto;
padding:15px;
gap:15px;
background:#222;
}

.story{
text-align:center;
}

.story img{
width:70px;
height:70px;
border-radius:50%;
border:3px solid #FFD600;
object-fit:cover;
}

.feed{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:#222;
border-radius:15px;
overflow:hidden;
}

.card video,.card img{
width:100%;
display:block;
}

.card h3{
padding:10px;
}

.upload{
padding:20px;
background:#1a1a1a;
margin:20px;
border-radius:15px;
}

input{
margin:10px 0;
width:100%;
padding:10px;
}

button.uploadBtn{
width:100%;
padding:12px;
background:#FFD600;
border:none;
border-radius:30px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>
<body>

<header>
<div>📸 Snap Clone</div>
<button>Profile</button>
</header>

<div class="story-bar">
<div class="story">
<img src="https://picsum.photos/100?1">
<p>You</p>
</div>

<div class="story">
<img src="https://picsum.photos/100?2">
<p>Alex</p>
</div>

<div class="story">
<img src="https://picsum.photos/100?3">
<p>Emma</p>
</div>

<div class="story">
<img src="https://picsum.photos/100?4">
<p>John</p>
</div>
</div>

<div class="upload">
<h2>Upload Story</h2>

<input type="file" id="file">

<button class="uploadBtn" onclick="uploadStory()">
Upload
</button>
</div>

<div class="feed" id="feed">

<div class="card">
<img src="https://picsum.photos/500/700?5">
<h3>Photo Story</h3>
</div>

<div class="card">
<video controls>
<source src="sample.mp4" type="video/mp4">
</video>
<h3>Video Story</h3>
</div>

</div>

<script>

function uploadStory(){

const file=document.getElementById("file").files[0];

if(!file){
alert("Select a file");
return;
}

const url=URL.createObjectURL(file);

const card=document.createElement("div");

card.className="card";

if(file.type.startsWith("image")){

card.innerHTML=`
<img src="${url}">
<h3>Your Photo Story</h3>
`;

}else if(file.type.startsWith("video")){

card.innerHTML=`
<video controls>
<source src="${url}">
</video>
<h3>Your Video Story</h3>
`;

}else{

alert("Only images or videos.");

return;

}

document.getElementById("feed").prepend(card);

alert("Story uploaded locally!");

}

</script>

</body>
</html>
